<!DOCTYPE html>
<html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cabaran Tating Lawi Ayam</title>
<style>
:root{font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#66cfff 0%,#d3f7ff 52%,#77c965 53%,#348b42 100%);overflow-x:hidden}.scene{min-height:100vh;position:relative;isolation:isolate;padding:18px 14px 35px}.scene:before{content:'';position:absolute;inset:0;z-index:-1;opacity:.32;background:radial-gradient(ellipse at 13% 22%,#fff 0 5%,transparent 5.3%),radial-gradient(ellipse at 72% 13%,#fff 0 7%,transparent 7.3%),linear-gradient(165deg,transparent 55%,#b87842 55% 58%,transparent 58%),repeating-linear-gradient(90deg,transparent 0 95px,#ffffff18 96px 99px)}.wrap{max-width:1050px;margin:auto}.title{text-align:center;filter:drop-shadow(0 5px 0 #663312)}h1{font-size:clamp(29px,6vw,66px);line-height:1.05;margin:8px 0 4px;color:#ffe34b;-webkit-text-stroke:2px #74330c;text-shadow:3px 5px #9d4319}h2{margin:0}.ribbon{display:inline-block;background:#f24d78;padding:7px 30px;border:4px solid white;border-radius:20px;box-shadow:0 5px #9c2354;font-size:clamp(15px,2.5vw,25px);font-weight:900}.panel{background:#fff4d9;color:#40291a;border:5px solid #8a4b22;border-radius:24px;box-shadow:0 9px #55301a,0 14px 30px #0003;padding:18px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:30px 0 25px}.mode{cursor:pointer;border:5px solid #fff;border-radius:24px;box-shadow:0 7px #6b3d24,0 12px 16px #0003;padding:16px 9px;min-height:220px;text-align:center;color:#fff;text-shadow:1px 2px #563b3b;background:linear-gradient(#42b9ff,#1261d2);transition:transform .15s}.mode:nth-child(2){background:linear-gradient(#ffc44e,#ed751c)}.mode:nth-child(3){background:linear-gradient(#d47aff,#7923d4)}.mode:hover,.mode:focus-visible{transform:translateY(-5px)}.mode.selected{outline:5px solid #ffe54a;outline-offset:3px}.mode h3{font-size:clamp(17px,2.6vw,27px);margin:8px 0}.mode p{font-weight:800;font-size:clamp(12px,1.8vw,16px)}.emoji{font-size:65px;display:block;filter:drop-shadow(0 5px 2px #0003)}button{font:inherit;font-weight:900;cursor:pointer}.mainbtn,.smallbtn{border:4px solid #fff;color:#472207;border-radius:19px;background:linear-gradient(#fff49b,#ffb72e);box-shadow:0 6px #a35b1e;padding:13px 25px}.mainbtn{font-size:clamp(22px,3vw,34px);display:block;margin:20px auto}.smallbtn{font-size:15px;padding:9px 15px}.bottom{display:flex;justify-content:center;flex-wrap:wrap;gap:13px}.hidden{display:none!important}.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:9px;margin:15px 0}.chip{background:#78411f;border:3px solid #ffc45c;border-radius:14px;padding:9px 13px;font-weight:900;box-shadow:0 4px #3c2114}.game{background:linear-gradient(#8cddff,#d8f9ff 68%,#a8dd79 68%,#5ba64c);border:6px solid #8b4c27;border-radius:25px;box-shadow:0 9px #51301c;overflow:hidden;position:relative}.game canvas{display:block;width:100%;height:auto;touch-action:none}.instructions{text-align:center;font-weight:800;background:#fff5d5;color:#50321b;border-radius:12px;padding:9px;margin:10px 0}.controls{display:flex;justify-content:center;gap:20px;margin:14px 0}.ctrl{border:4px solid white;border-radius:20px;background:#8737d5;color:white;font-size:30px;min-width:76px;min-height:64px;box-shadow:0 5px #542383;touch-action:none}.message{font-size:20px;text-align:center;font-weight:900;color:#572a0e;background:#fff7d6;border-radius:14px;padding:12px;margin:10px 0}.modal{position:fixed;inset:0;background:#0009;z-index:10;display:grid;place-items:center;padding:20px}.modal .panel{max-width:520px;width:100%;max-height:85vh;overflow:auto}.modal h2{text-align:center;color:#8631b6}.modal p,.modal li{line-height:1.55}.modal .smallbtn{display:block;margin:20px auto 0}.scoreline{padding:8px;border-bottom:1px solid #cda76a}.tag{font-weight:900;color:#643399}.footer{text-align:center;color:#194b20;font-weight:900;margin-top:25px}@media(max-width:650px){.modes{grid-template-columns:1fr;gap:12px;margin:20px 0}.mode{min-height:130px;display:grid;grid-template-columns:80px 1fr;align-items:center;text-align:left;gap:0 12px}.mode .emoji{grid-row:1/3;font-size:55px}.mode h3{margin:0}.mode p{margin:0}.hud{justify-content:center}.chip{font-size:13px}.controls .ctrl{min-width:70px}}
</style></head><body><div class="scene"><div class="wrap">
<section id="menu"><header class="title"><h1>🪶 Cabaran<br>Tating Lawi Ayam</h1><div class="ribbon">Misi Juara Timangan</div></header><div class="modes"><button class="mode selected" data-mode="0"><span class="emoji">🪶</span><h3>Tahap 1<br>Timang Juara</h3><p>Timang lawi ayam dan kumpul mata!</p></button><button class="mode" data-mode="1"><span class="emoji">🎯</span><h3>Tahap 2<br>Sasaran Tepat</h3><p>Arahkan lawi ayam ke sasaran bonus!</p></button><button class="mode" data-mode="2"><span class="emoji">🏆</span><h3>Tahap 3<br>Raja Timangan</h3><p>Timang sebanyak mungkin dalam 30 saat!</p></button></div><button id="start" class="mainbtn">▶ Mula Bermain</button><div class="bottom"><button class="smallbtn" id="guide">📖 Panduan</button><button class="smallbtn" id="scores">🏅 Papan Skor</button><button class="smallbtn" id="sound">🔊 Bunyi: Hidup</button></div></section>
<section id="play" class="hidden"><div class="title"><h1 style="font-size:clamp(25px,4vw,43px)">🪶 Misi Juara Timangan</h1></div><div class="hud"><span class="chip" id="level">Tahap 1</span><span class="chip" id="score">⭐ Skor: 0</span><span class="chip" id="lives">❤️❤️❤️</span><span class="chip" id="time">⏱️ 45s</span></div><div class="game"><canvas id="canvas" width="900" height="480" aria-label="Permainan menimang lawi ayam"></canvas></div><div class="instructions" id="hint">Gerakkan pemain dengan ◀ ▶, tekan ⬆ / SPACE untuk menimang apabila lawi ayam dekat dengan kaki.</div><div class="controls"><button class="ctrl" id="left">◀</button><button class="ctrl" id="kick">⬆</button><button class="ctrl" id="right">▶</button></div><div class="bottom"><button class="smallbtn" id="pause">⏸ Jeda</button><button class="smallbtn" id="restart">🔄 Ulang</button><button class="smallbtn" id="home">🏠 Menu</button></div><div id="msg" class="message hidden"></div></section>
<div class="footer">Permainan tradisional • Pendidikan Jasmani Tahun 5</div></div></div>
<div class="modal hidden" id="modal"><div class="panel"><h2 id="modalTitle"></h2><div id="modalText"></div><button class="smallbtn" id="close">Tutup</button></div></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),cv=$('canvas'),ctx=cv.getContext('2d');let mode=0,playing=false,paused=false,score=0,lives=3,remaining=45,last=0,elapsed=0,streak=0,highs=[0,0,0],sound=true,held={left:false,right:false},player={x:450},bird={x:450,y:130,vx:0,vy:0},target={x:450,dir:1},particles=[],audio;const names=['Timang Juara','Sasaran Tepat','Raja Timangan'];try{highs=JSON.parse(localStorage.getItem('lawiHighs')||'[0,0,0]')}catch(e){}function beep(f=550){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.08,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.11);o.start();o.stop(audio.currentTime+.12)}catch(e){}}function hud(){$('level').textContent=`Tahap ${mode+1}: ${names[mode]}`;$('score').textContent='⭐ Skor: '+score;$('lives').textContent='❤️'.repeat(Math.max(0,lives));$('time').textContent='⏱️ '+Math.ceil(remaining)+'s'}function resetBird(){bird={x:player.x,y:95,vx:(Math.random()-.5)*80,vy:65}}function start(){score=0;lives=3;streak=0;remaining=mode===2?30:45;elapsed=0;player.x=450;target.x=450;paused=false;playing=true;particles=[];resetBird();$('menu').classList.add('hidden');$('play').classList.remove('hidden');$('msg').classList.add('hidden');$('pause').textContent='⏸ Jeda';hud();last=performance.now();requestAnimationFrame(loop)}function finish(){playing=false;let record=score>highs[mode];if(record){highs[mode]=score;try{localStorage.setItem('lawiHighs',JSON.stringify(highs))}catch(e){}}$('msg').innerHTML=(record?'🏆 Rekod Baharu! ':'🎉 Tamat Permainan! ')+`Skor anda: <b>${score}</b> • Timangan berturut-turut: ${streak}`;$('msg').classList.remove('hidden');beep(750)}function kick(){if(!playing||paused)return;let dx=Math.abs(bird.x-player.x),dy=bird.y;if(dx<100&&dy>275&&dy<430&&bird.vy>0){bird.vy=-(mode===2?385:360);bird.vx+=(bird.x-player.x)*.9;bird.y=Math.min(bird.y,370);score+=10;streak++;for(let i=0;i<9;i++)particles.push({x:bird.x,y:bird.y,vx:(Math.random()-.5)*200,vy:-Math.random()*180,life:.6});if(mode===1&&Math.abs(bird.x-target.x)<75){score+=40;beep(900)}else beep(520);hud()}}function update(dt){elapsed+=dt;remaining=Math.max(0,remaining-dt);if(held.left)player.x-=340*dt;if(held.right)player.x+=340*dt;player.x=Math.max(55,Math.min(845,player.x));bird.vy+=600*dt;bird.x+=bird.vx*dt;bird.y+=bird.vy*dt;if(bird.x<25){bird.x=25;bird.vx=Math.abs(bird.vx)}if(bird.x>875){bird.x=875;bird.vx=-Math.abs(bird.vx)}if(mode===1){target.x+=target.dir*110*dt;if(target.x<110||target.x>790)target.dir*=-1}if(bird.y>455){lives--;streak=0;beep(170);resetBird()}particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);hud();if(lives<=0||remaining<=0)finish()}function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function feather(x,y,scale=1){ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(elapsed*5)*.13);ctx.scale(scale,scale);let cols=['#ff3e59','#ffca21','#13bde1','#9d45e8','#51cb58'];for(let i=0;i<5;i++){ctx.save();ctx.rotate((i-2)*.24);ctx.fillStyle=cols[i];ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,-24,9,29,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore()}rounded(-12,-3,24,16,5,'#d98d32');rounded(-10,1,20,8,3,'#f7e8b6');ctx.restore()}function draw(){ctx.clearRect(0,0,900,480);let sky=ctx.createLinearGradient(0,0,0,480);sky.addColorStop(0,'#69cafa');sky.addColorStop(.78,'#e8f9fd');sky.addColorStop(.79,'#8fcf69');sky.addColorStop(1,'#4e9e4d');ctx.fillStyle=sky;ctx.fillRect(0,0,900,480);ctx.fillStyle='#ffffff99';for(let i=0;i<4;i++){ctx.beginPath();ctx.ellipse(120+i*240,80+(i%2)*25,80,20,0,0,7);ctx.fill()}for(let i=0;i<9;i++){let x=i*115;ctx.fillStyle='#7b4e30';ctx.fillRect(x+30,255,12,80);ctx.fillStyle=['#3aab54','#4abf65'][i%2];ctx.beginPath();ctx.arc(x+35,246,42,0,7);ctx.fill()}ctx.fillStyle='#b77d47';ctx.fillRect(0,402,900,78);ctx.fillStyle='#e2a36c';ctx.fillRect(0,405,900,9);ctx.strokeStyle='#fff9';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(450,432,280,27,0,0,7);ctx.stroke();if(mode===1){ctx.strokeStyle='#f84042';ctx.lineWidth=10;ctx.beginPath();ctx.arc(target.x,145,45,0,7);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=8;ctx.beginPath();ctx.arc(target.x,145,27,0,7);ctx.stroke();ctx.fillStyle='#f84042';ctx.beginPath();ctx.arc(target.x,145,12,0,7);ctx.fill()}ctx.save();ctx.translate(player.x,0);ctx.fillStyle='#24243b';rounded(-30,340,25,65,8,'#24243b');rounded(8,340,25,65,8,'#24243b');rounded(-37,390,38,18,7,'#2266dc');rounded(7,390,42,18,7,'#2266dc');rounded(-42,267,84,85,17,'#8137bb');rounded(-49,283,16,58,8,'#f5b77c');rounded(33,283,16,58,8,'#f5b77c');ctx.fillStyle='#f4b779';ctx.beginPath();ctx.arc(0,235,43,0,7);ctx.fill();ctx.fillStyle='#302019';ctx.beginPath();ctx.arc(0,213,40,Math.PI,Math.PI*2);ctx.fill();rounded(-43,198,86,13,5,'#f3c02f');ctx.fillStyle='#2e211a';ctx.beginPath();ctx.arc(-14,234,4,0,7);ctx.arc(14,234,4,0,7);ctx.fill();ctx.strokeStyle='#9b4b40';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,245,11,0,Math.PI);ctx.stroke();ctx.restore();feather(bird.x,bird.y,.95);particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/.6);ctx.fillStyle='#ffec40';ctx.beginPath();ctx.arc(p.x,p.y,5,0,7);ctx.fill()});ctx.globalAlpha=1;if(paused){rounded(310,180,280,90,22,'#4d2986df');ctx.fillStyle='white';ctx.font='bold 43px system-ui';ctx.textAlign='center';ctx.fillText('JEDA',450,240)}if(!playing){rounded(245,35,410,65,18,'#66308ccc');ctx.fillStyle='white';ctx.font='bold 27px system-ui';ctx.textAlign='center';ctx.fillText('Permainan Tamat!',450,78)}}function loop(t){if(!playing){draw();return}let dt=Math.min((t-last)/1000,.04);last=t;if(!paused)update(dt);draw();if(playing)requestAnimationFrame(loop)}function show(title,html){$('modalTitle').textContent=title;$('modalText').innerHTML=html;$('modal').classList.remove('hidden')}document.querySelectorAll('.mode').forEach(el=>el.addEventListener('click',()=>{mode=+el.dataset.mode;document.querySelectorAll('.mode').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');beep(400)}));$('start').onclick=start;$('restart').onclick=start;$('home').onclick=()=>{playing=false;$('play').classList.add('hidden');$('menu').classList.remove('hidden')};$('pause').onclick=()=>{if(!playing)return;paused=!paused;$('pause').textContent=paused?'▶ Sambung':'⏸ Jeda';last=performance.now();if(!paused)requestAnimationFrame(loop);else draw()};$('guide').onclick=()=>show('📖 Panduan Permainan','<p><b>1.</b> Pilih satu tahap dan tekan Mula Bermain.</p><p><b>2.</b> Gerakkan pemain menggunakan kekunci kiri/kanan atau butang skrin.</p><p><b>3.</b> Tekan SPACE, anak panah atas atau butang ⬆ apabila lawi ayam hampir dengan kaki untuk menimang.</p><p><b>4.</b> Setiap timangan mendapat 10 mata. Tahap 2 memberi 40 mata bonus jika berjaya menimang di bawah sasaran bergerak.</p><p><b>5.</b> Anda mempunyai 3 nyawa. Jangan biarkan lawi ayam jatuh!</p>');$('scores').onclick=()=>show('🏅 Papan Skor',highs.map((s,i)=>`<div class="scoreline"><span class="tag">Tahap ${i+1} – ${names[i]}</span><br>⭐ ${s} mata</div>`).join('')+'<p>Rekod disimpan dalam pelayar peranti ini sahaja.</p>');$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 Bunyi: Hidup':'🔇 Bunyi: Mati'};$('close').onclick=()=>$('modal').classList.add('hidden');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.add('hidden')};function bind(id,key){let el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();if(key==='kick')kick();else held[key]=true;el.setPointerCapture(e.pointerId)});for(let event of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(event,()=>{if(key!=='kick')held[key]=false})}bind('left','left');bind('right','right');bind('kick','kick');window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft')held.left=true;if(e.code==='ArrowRight')held.right=true;if((e.code==='ArrowUp'||e.code==='Space')&&!e.repeat)kick()});window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft')held.left=false;if(e.code==='ArrowRight')held.right=false});cv.addEventListener('pointerdown',kick);draw()})();
</script></body></html>
